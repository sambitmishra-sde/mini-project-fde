# The simplest way to run this project in Airflow: ONE container in "standalone" mode
# (web UI + scheduler + database all in one). Great for learning - NOT for production.
#
#   docker compose up        -> open http://localhost:8080 (no login needed locally)
#   docker compose down      -> stop it
services:
  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    # On Linux, run `echo "AIRFLOW_UID=$(id -u)" >> .env` once so Airflow can write to ./output
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"                  # hide Airflow's ~50 example DAGs
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # skip the login page (local use only!)
      LEAD_PROJECT_DIR: /opt/airflow/project                 # where data/ and output/ are mounted
      # LLM settings are read from your shell or from the .env file next to this file
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
    volumes:
      - ./dags:/opt/airflow/dags                 # Airflow picks up our DAG from here
      - ./data:/opt/airflow/project/data         # input CSVs
      - ./output:/opt/airflow/project/output     # reports appear here on your machine
